name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run compose:check
      - run: docker compose -p astra-local -f deploy/compose/docker-compose.yml up -d --wait postgres minio
      - run: docker compose -p astra-local -f deploy/compose/docker-compose.yml run --rm database-migrate
      - run: docker compose -p astra-local -f deploy/compose/docker-compose.yml run --rm minio-init
      - run: bun run test:integration:local
      - if: always()
        run: docker compose -p astra-local -f deploy/compose/docker-compose.yml down
