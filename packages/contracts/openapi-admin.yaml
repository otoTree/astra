openapi: 3.1.0
info:
  title: Astra Admin API
  version: 1.0.0
  description: Versioned operations API for Astra administrators. Platform-managed username/password sessions, CSRF and RBAC are required.
servers:
  - url: https://astra-admin.internal.example/admin/v1
security:
  - adminSession: []
paths:
  /sessions/login:
    post:
      operationId: loginAdminSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSessionLogin' }
      responses:
        '201':
          description: Server-side admin session created
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/current:
    get:
      operationId: getCurrentAdminSession
      security:
        - adminSession: []
      responses:
        '200':
          description: Current session and effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeCurrentAdminSession
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Session revoked }
        default: { $ref: '#/components/responses/Error' }
  /tasks:
    get:
      operationId: listAdminTasks
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { description: Task list }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}:
    get:
      operationId: getAdminTask
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: Task detail and timeline }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/sensitive-request:
    get:
      operationId: getAdminTaskSensitiveRequest
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AccessPurpose'
      responses:
        '200':
          description: Decrypted immutable Task request with audited access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitiveTaskRequest' }
        default: { $ref: '#/components/responses/Error' }
  /models:
    get:
      operationId: listAdminModels
      responses:
        '200': { description: Model list }
    post:
      operationId: createAdminModel
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelCreate' }
      responses:
        '201': { description: Model created }
        default: { $ref: '#/components/responses/Error' }
  /models/{model_id}:
    patch:
      operationId: updateAdminModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelUpdate' }
      responses:
        '200': { description: Model version advanced }
        default: { $ref: '#/components/responses/Error' }
  /releases:
    get:
      operationId: listReleases
      responses:
        '200': { description: Release list }
    post:
      operationId: createRelease
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseCreate' }
      responses:
        '201': { description: OCI tag resolved once and immutable Release created }
        default: { $ref: '#/components/responses/Error' }
  /releases/{release_id}/approval:
    post:
      operationId: approveOrRejectRelease
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseApproval' }
      responses:
        '200': { description: Immutable approval recorded }
        default: { $ref: '#/components/responses/Error' }
  /pools:
    get:
      operationId: listPools
      responses:
        '200': { description: Model pool list }
    post:
      operationId: createPool
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoolCreate' }
      responses:
        '201': { description: Pool created }
        default: { $ref: '#/components/responses/Error' }
  /pools/{pool_id}:
    patch:
      operationId: updatePool
      parameters:
        - $ref: '#/components/parameters/PoolId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoolUpdate' }
      responses:
        '200': { description: Pool version advanced }
        default: { $ref: '#/components/responses/Error' }
  /policies/validate:
    post:
      operationId: validatePolicy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyValidation' }
      responses:
        '201': { description: Immutable validated policy version }
        default: { $ref: '#/components/responses/Error' }
  /policies/{policy_id}/impact-previews:
    post:
      operationId: previewPolicyImpact
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyImpactPreview' }
      responses:
        '201': { description: Immutable impact preview }
        default: { $ref: '#/components/responses/Error' }
  /policies/{policy_id}/publish:
    post:
      operationId: publishPolicy
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyPublish' }
      responses:
        '200': { description: Validated policy version published }
        default: { $ref: '#/components/responses/Error' }
  /pools/{pool_id}/policies/{policy_type}/rollback:
    post:
      operationId: rollbackPolicy
      parameters:
        - $ref: '#/components/parameters/PoolId'
        - $ref: '#/components/parameters/PolicyType'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRollback' }
      responses:
        '201': { description: New published version copied from historical policy }
        default: { $ref: '#/components/responses/Error' }
  /aliases/{alias}/switch:
    post:
      operationId: switchModelAlias
      parameters:
        - $ref: '#/components/parameters/Alias'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AliasSwitch' }
      responses:
        '200': { description: Alias version created }
        default: { $ref: '#/components/responses/Error' }
  /rollouts:
    get:
      operationId: listRollouts
      responses:
        '200': { description: Rollout list }
    post:
      operationId: createRollout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutCreate' }
      responses:
        '202': { description: Rollout accepted }
        default: { $ref: '#/components/responses/Error' }
  /rollouts/preview:
    post:
      operationId: previewRollout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutPreview' }
      responses:
        '201': { description: Immutable rollout impact preview }
        default: { $ref: '#/components/responses/Error' }
  /rollouts/{rollout_id}:
    get:
      operationId: getRollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200': { description: Rollout detail }
        default: { $ref: '#/components/responses/Error' }
  /rollouts/{rollout_id}/pause:
    post:
      operationId: pauseRollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutControl' }
      responses:
        '200': { description: Rollout paused }
        default: { $ref: '#/components/responses/Error' }
  /rollouts/{rollout_id}/resume:
    post:
      operationId: resumeRollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutControl' }
      responses:
        '200': { description: Rollout resumed }
        default: { $ref: '#/components/responses/Error' }
  /rollouts/{rollout_id}/rollback:
    post:
      operationId: rollbackRollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutControl' }
      responses:
        '202': { description: Reverse rollout accepted }
        default: { $ref: '#/components/responses/Error' }
  /workers:
    get:
      operationId: listWorkers
      responses:
        '200': { description: Worker list }
  /replicas:
    get:
      operationId: listReplicas
      responses:
        '200': { description: Replica list }
  /provider-operations:
    get:
      operationId: listProviderOperations
      responses:
        '200': { description: Provider operation list }
  /regions:
    get:
      operationId: listProviderRegions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { description: Provider region list }
        default: { $ref: '#/components/responses/Error' }
  /inventory:
    get:
      operationId: listProviderInventory
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { description: Current normalized provider inventory snapshots }
        default: { $ref: '#/components/responses/Error' }
  /cost-summary:
    get:
      operationId: getCostSummary
      responses:
        '200': { description: Project daily usage and cost summary }
        default: { $ref: '#/components/responses/Error' }
  /audit-events:
    get:
      operationId: listAuditEvents
      responses:
        '200': { description: Audit event list }
  /aliases:
    get:
      operationId: listAliasVersions
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }]
      responses:
        '200': { description: Alias version list }
        default: { $ref: '#/components/responses/Error' }
  /policies:
    get:
      operationId: listPolicyVersions
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }]
      responses:
        '200': { description: Policy version list }
        default: { $ref: '#/components/responses/Error' }
  /policy-previews:
    get:
      operationId: listPolicyImpactPreviews
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }]
      responses:
        '200': { description: Immutable policy impact preview list }
        default: { $ref: '#/components/responses/Error' }
  /release-approvals:
    get:
      operationId: listReleaseApprovals
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }]
      responses:
        '200': { description: Immutable Release approval list }
        default: { $ref: '#/components/responses/Error' }
  /capacity-plans:
    get:
      operationId: listCapacityPlans
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }]
      responses:
        '200': { description: Immutable capacity plan list }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-astra_admin_session
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      schema: { type: string }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    RolloutId:
      name: rollout_id
      in: path
      required: true
      schema: { type: string }
    ModelId:
      name: model_id
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema: { type: string }
    PoolId:
      name: pool_id
      in: path
      required: true
      schema: { type: string }
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema: { type: string }
    PolicyType:
      name: policy_type
      in: path
      required: true
      schema: { type: string, enum: [capacity, budget, region, retry] }
    Alias:
      name: alias
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Decimal current resource version, optionally quoted or weakly quoted.
      schema: { type: string }
    AccessPurpose:
      name: X-Access-Purpose
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 500 }
  schemas:
    AdminSessionLogin:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    AdminSession:
      type: object
      additionalProperties: false
      required: [id, object, organization_id, project_id, subject, display_name, email, organization_roles, project_roles, permissions, created_at, expires_at]
      properties:
        id: { type: string }
        object: { type: string, const: admin.session }
        organization_id: { type: string }
        project_id: { type: string }
        subject: { type: string }
        display_name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        organization_roles:
          type: array
          items: { type: string, enum: [viewer, operator, model_releaser, security_auditor, admin] }
        project_roles:
          type: array
          items: { type: string, enum: [viewer, operator, model_releaser, security_auditor, admin] }
        permissions:
          type: array
          items: { type: string }
        csrf_token: { type: string, minLength: 32 }
        created_at: { type: integer, minimum: 0 }
        expires_at: { type: integer, minimum: 0 }
    SensitiveTaskRequest:
      type: object
      additionalProperties: false
      required: [task_id, request, accessed_at]
      properties:
        task_id: { type: string }
        request: { type: object, additionalProperties: true }
        accessed_at: { type: integer, minimum: 0 }
    ModelCreate:
      type: object
      additionalProperties: false
      required: [alias, modality, reason]
      properties:
        alias: { type: string, minLength: 3, maxLength: 128 }
        modality: { type: string, enum: [video, image] }
        description: { type: string, maxLength: 2000, default: '' }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    ModelUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, status, description, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, disabled] }
        description: { type: string, maxLength: 2000 }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    ReleaseCreate:
      type: object
      additionalProperties: false
      required: [model_id, source_image, workflow_hash, manifest, reason]
      properties:
        model_id: { type: string }
        source_image: { type: string, minLength: 3, maxLength: 2048 }
        workflow_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        maturity: { type: string, enum: [candidate, stable, deprecated], default: candidate }
        manifest: { $ref: '#/components/schemas/ReleaseManifest' }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    ReleaseManifest:
      type: object
      additionalProperties: false
      required: [worker_contract_version, modalities, operations, capabilities, parameter_schema, output_contract, resource_requirements, components, weights]
      properties:
        worker_contract_version: { type: string, const: v1 }
        modalities: { type: array, minItems: 1, maxItems: 2, items: { type: string, enum: [video, image] } }
        operations: { type: array, minItems: 1, maxItems: 2, items: { type: string, enum: [generation, edit] } }
        capabilities: { type: object, additionalProperties: true }
        parameter_schema: { type: object, additionalProperties: true }
        output_contract: { type: object, additionalProperties: true }
        resource_requirements:
          type: object
          additionalProperties: false
          required: [gpu_skus, gpu_memory_bytes]
          properties:
            gpu_skus: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
            gpu_memory_bytes: { type: integer, minimum: 1 }
            concurrency: { type: integer, minimum: 1, maximum: 16, default: 1 }
        service_time_baseline:
          type: object
          additionalProperties: false
          required: [default_gpu_seconds]
          properties:
            default_gpu_seconds: { type: integer, minimum: 1 }
            video_duration_gpu_seconds:
              type: object
              default: {}
              additionalProperties: { type: integer, minimum: 1 }
            image_gpu_seconds_per_output: { type: integer, minimum: 1 }
        components:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [name, commit]
            properties:
              name: { type: string }
              commit: { type: string, minLength: 7, maxLength: 128 }
        weights:
          type: array
          maxItems: 256
          description: Hash metadata only. Astra never downloads weight binaries.
          items:
            type: object
            additionalProperties: false
            required: [logical_name, sha256, size_bytes]
            properties:
              logical_name: { type: string }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              size_bytes: { type: integer, minimum: 1 }
              source_uri: { type: string, format: uri }
    ReleaseApproval:
      type: object
      additionalProperties: false
      required: [expected_version, decision, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    PoolCreate:
      type: object
      additionalProperties: false
      required: [release_id, provider, region_id, gpu_sku, execution_mode, reason]
      properties:
        release_id: { type: string }
        provider: { type: string }
        region_id: { type: string }
        gpu_sku: { type: string }
        execution_mode: { type: string, enum: [deployment, batch] }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    PoolUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, status, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, disabled, degraded] }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    CapacityPolicyConfiguration:
      type: object
      additionalProperties: false
      required: [min_replicas, max_replicas, queue_target_seconds, target_utilization_percent, scale_up_step, scale_down_step_percent, idle_window_seconds, scale_down_cooldown_seconds, hysteresis_percent]
      properties:
        mode: { type: string, enum: [automatic, protected, manual], default: automatic }
        min_replicas: { type: integer, minimum: 0 }
        max_replicas: { type: integer, minimum: 1 }
        manual_replicas: { type: integer, minimum: 0 }
        queue_target_seconds: { type: integer, minimum: 1 }
        max_queue_eta_seconds: { type: integer, minimum: 1, default: 900 }
        backlog_drain_seconds: { type: integer, minimum: 1, default: 1800 }
        target_utilization_percent: { type: integer, minimum: 1, maximum: 100 }
        scale_up_step: { type: integer, minimum: 1 }
        emergency_scale_up_step: { type: integer, minimum: 1, default: 10 }
        scale_down_step_percent: { type: integer, minimum: 1, maximum: 100 }
        idle_window_seconds: { type: integer, minimum: 60 }
        scale_down_observation_seconds: { type: integer, minimum: 60, default: 900 }
        scale_down_cooldown_seconds: { type: integer, minimum: 60 }
        scale_up_cooldown_seconds: { type: integer, minimum: 1, default: 60 }
        hysteresis_percent: { type: integer, minimum: 0, maximum: 100 }
        scale_down_safety_margin_percent: { type: integer, minimum: 0, maximum: 100, default: 25 }
        min_hold_seconds: { type: integer, minimum: 60, default: 1800 }
        provisioning_p90_seconds: { type: integer, minimum: 1, default: 300 }
        min_net_benefit_minor: { type: integer, minimum: 0, default: 0 }
        min_net_saving_minor: { type: integer, minimum: 0, default: 0 }
        wait_value_minor_per_minute: { type: integer, minimum: 0, default: 0 }
        slo_penalty_minor_per_minute: { type: integer, minimum: 0, default: 0 }
        batch_min_share_percent: { type: integer, minimum: 0, maximum: 100, default: 10 }
        aging_seconds: { type: integer, minimum: 60, maximum: 86400, default: 1800 }
        prediction_min_samples: { type: integer, minimum: 1, maximum: 10000, default: 30 }
        ewma_alpha_basis_points: { type: integer, minimum: 1, maximum: 10000, default: 2000 }
    RegionPolicyConfiguration:
      type: object
      additionalProperties: false
      required: [allowed_regions, max_price_per_gpu_hour_minor, completion_weight, cost_weight, failure_weight, cold_start_weight, transfer_weight]
      properties:
        allowed_regions: { type: array, minItems: 1, maxItems: 64, items: { type: string, minLength: 3, maxLength: 128, pattern: '^[a-z0-9][a-z0-9_.-]*$' } }
        allowed_providers: { type: array, minItems: 1, maxItems: 64, items: { type: string, minLength: 3, maxLength: 128, pattern: '^[a-z0-9][a-z0-9_.-]*$' } }
        max_price_per_gpu_hour_minor: { type: integer, minimum: 0 }
        completion_weight: { type: integer, minimum: 0, maximum: 1000 }
        cost_weight: { type: integer, minimum: 0, maximum: 1000 }
        failure_weight: { type: integer, minimum: 0, maximum: 1000 }
        cold_start_weight: { type: integer, minimum: 0, maximum: 1000 }
        transfer_weight: { type: integer, minimum: 0, maximum: 1000 }
    PolicyValidation:
      type: object
      additionalProperties: false
      required: [policy_type, pool_id, configuration, reason]
      properties:
        policy_type: { type: string, enum: [capacity, budget, region, retry] }
        pool_id: { type: string }
        configuration: { oneOf: [{ $ref: '#/components/schemas/CapacityPolicyConfiguration' }, { $ref: '#/components/schemas/RegionPolicyConfiguration' }, { type: object, additionalProperties: true }] }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    PolicyImpactPreview:
      type: object
      additionalProperties: false
      required: [expected_policy_version, horizon_seconds, reason]
      properties:
        expected_policy_version: { type: integer, minimum: 1 }
        horizon_seconds: { type: integer, minimum: 300, maximum: 86400 }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    PolicyPublish:
      type: object
      additionalProperties: false
      required: [expected_policy_version, preview_id, reason]
      properties:
        expected_policy_version: { type: integer, minimum: 1 }
        preview_id: { type: string }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    PolicyRollback:
      type: object
      additionalProperties: false
      required: [expected_current_version, target_policy_id, reason]
      properties:
        expected_current_version: { type: integer, minimum: 1 }
        target_policy_id: { type: string }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    AliasSwitch:
      type: object
      additionalProperties: false
      required: [model_id, release_id, expected_version, reason]
      properties:
        model_id: { type: string }
        release_id: { type: string }
        expected_version: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    RolloutCreate:
      type: object
      additionalProperties: false
      required: [release_id, pool_id, preview_id, expected_pool_version, reason]
      properties:
        release_id: { type: string }
        pool_id: { type: string }
        preview_id: { type: string }
        expected_pool_version: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    RolloutStrategy:
      type: object
      additionalProperties: false
      required: [max_surge, max_unavailable, batch_size, readiness_timeout_seconds, readiness_stability_seconds, progress_deadline_seconds, pause_on_failure, maximum_failure_rate_basis_points, maximum_duration_regression_basis_points, maximum_extra_cost_minor, currency, rollback_retention_seconds]
      properties:
        max_surge: { type: integer, minimum: 0, maximum: 100, default: 1 }
        max_unavailable: { type: integer, minimum: 0, maximum: 100, default: 0 }
        batch_size: { type: integer, minimum: 1, maximum: 100, default: 1 }
        readiness_timeout_seconds: { type: integer, minimum: 60, maximum: 7200, default: 1800 }
        readiness_stability_seconds: { type: integer, minimum: 10, maximum: 1800, default: 60 }
        progress_deadline_seconds: { type: integer, minimum: 300, maximum: 86400, default: 7200 }
        pause_on_failure: { type: boolean, default: true }
        maximum_failure_rate_basis_points: { type: integer, minimum: 0, maximum: 10000, default: 500 }
        maximum_duration_regression_basis_points: { type: integer, minimum: 0, maximum: 100000, default: 2500 }
        maximum_extra_cost_minor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        rollback_retention_seconds: { type: integer, minimum: 3600, maximum: 2592000, default: 604800 }
    RolloutPreview:
      type: object
      additionalProperties: false
      required: [release_id, pool_id, expected_pool_version, strategy, reason]
      properties:
        release_id: { type: string }
        pool_id: { type: string }
        expected_pool_version: { type: integer, minimum: 1 }
        strategy: { $ref: '#/components/schemas/RolloutStrategy' }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    RolloutControl:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, retryable, request_id]
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            request_id: { type: string }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
