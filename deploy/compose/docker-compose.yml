name: astra-local

services:
  postgres:
    image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: ${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}
      POSTGRES_PASSWORD: ${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}
      POSTGRES_DB: ${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
    ports:
      - "${ASTRA_LOCAL_POSTGRES_PORT:?set in .env.local}:5432"
    volumes:
      - astra-local-postgres:/var/lib/postgresql/data
    networks: [astra-local-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  database-migrate:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "packages/database/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
    depends_on: { postgres: { condition: service_healthy } }
    networks: [astra-local-network]
    restart: "no"

  identity-bootstrap:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "scripts/bootstrap-local-identity.ts"]
    environment:
      ASTRA_ENV: local
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
      ASTRA_LOCAL_API_KEY: ${ASTRA_LOCAL_API_KEY:?set in .env.local}
    depends_on: { database-migrate: { condition: service_completed_successfully } }
    networks: [astra-local-network]
    restart: "no"

  redis-node-1:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    ports: ["${ASTRA_LOCAL_REDIS_PORT:?set in .env.local}:6379"]
    volumes: ["astra-local-redis-1:/data"]
    networks: [astra-local-network]
  redis-node-2:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes: ["astra-local-redis-2:/data"]
    networks: [astra-local-network]
  redis-node-3:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes: ["astra-local-redis-3:/data"]
    networks: [astra-local-network]
  redis-node-4:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes: ["astra-local-redis-4:/data"]
    networks: [astra-local-network]
  redis-node-5:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes: ["astra-local-redis-5:/data"]
    networks: [astra-local-network]
  redis-node-6:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes: ["astra-local-redis-6:/data"]
    networks: [astra-local-network]
  redis-cluster-init:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    depends_on:
      redis-node-1: { condition: service_started }
      redis-node-2: { condition: service_started }
      redis-node-3: { condition: service_started }
      redis-node-4: { condition: service_started }
      redis-node-5: { condition: service_started }
      redis-node-6: { condition: service_started }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sleep 3;
        redis-cli -h redis-node-1 cluster info | grep -q 'cluster_state:ok' ||
        redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379
        redis-node-4:6379 redis-node-5:6379 redis-node-6:6379 --cluster-replicas 1 --cluster-yes
    networks: [astra-local-network]
    restart: "no"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda@sha256:04baa40ed34edf86028396f762be802f3b6b0acaab65e9de696a3f15d54c550f
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:59092
    ports: ["${ASTRA_LOCAL_KAFKA_PORT:?set in .env.local}:19092"]
    volumes: ["astra-local-redpanda:/var/lib/redpanda/data"]
    networks: [astra-local-network]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=127.0.0.1:9092 --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-topic-init:
    image: docker.redpanda.com/redpandadata/redpanda@sha256:04baa40ed34edf86028396f762be802f3b6b0acaab65e9de696a3f15d54c550f
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        for topic in astra.task-lifecycle.v1 astra.capacity.v1 astra.usage.v1
        astra.audit.v1 astra.control.v1; do
          rpk topic create "$$topic" -X brokers=redpanda:9092 >/dev/null 2>&1 ||
          rpk topic describe "$$topic" -X brokers=redpanda:9092 >/dev/null;
        done;
        rpk topic list -X brokers=redpanda:9092
    depends_on: { redpanda: { condition: service_healthy } }
    networks: [astra-local-network]
    restart: "no"

  minio:
    image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ASTRA_LOCAL_S3_ACCESS_KEY:?set in .env.local}
      MINIO_ROOT_PASSWORD: ${ASTRA_LOCAL_S3_SECRET_KEY:?set in .env.local}
    ports:
      - "${ASTRA_LOCAL_S3_PORT:?set in .env.local}:9000"
      - "${ASTRA_LOCAL_S3_CONSOLE_PORT:?set in .env.local}:9001"
    volumes: ["astra-local-minio:/data"]
    networks: [astra-local-network]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set astra http://minio:9000 ${ASTRA_LOCAL_S3_ACCESS_KEY:?set in .env.local} ${ASTRA_LOCAL_S3_SECRET_KEY:?set in .env.local} && mc mb --ignore-existing astra/${ASTRA_LOCAL_S3_BUCKET:?set in .env.local}"]
    depends_on: { minio: { condition: service_healthy } }
    networks: [astra-local-network]
    restart: "no"

  identity-reference:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "apps/identity-reference/src/main.ts"]
    environment:
      ASTRA_ENV: local
      IDENTITY_REFERENCE_PORT: 4180
      IDENTITY_REFERENCE_ISSUER: http://identity-reference:4180
      IDENTITY_REFERENCE_AUDIENCE: astra-admin
    ports: ["${ASTRA_LOCAL_IDENTITY_PORT:-54180}:4180"]
    networks: [astra-local-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4180/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  registry-reference:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "apps/registry-reference/src/main.ts"]
    environment:
      ASTRA_ENV: local
      REGISTRY_REFERENCE_PORT: 5000
    networks: [astra-local-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  model-app:
    build:
      context: ../..
      dockerfile: model-workers/reference/Dockerfile
    environment:
      MODEL_APP_PORT: 9000
      MODEL_APP_RELEASE: local-reference-release
      MODEL_APP_VIDEO_FIXTURE: /app/fixtures/sample.mp4
    ports: ["${ASTRA_LOCAL_MODEL_APP_PORT:?set in .env.local}:9000"]
    tmpfs:
      - /work:uid=1000,gid=1000,mode=0700
    networks: [astra-local-network]

  media-validator:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.media-validator
    environment:
      MEDIA_VALIDATOR_PORT: 4113
      MEDIA_VALIDATOR_TOKEN: ${ASTRA_LOCAL_MEDIA_VALIDATOR_TOKEN:?set in .env.local}
      MEDIA_VALIDATOR_MAX_BYTES: 5368709120
      MEDIA_VALIDATOR_TIMEOUT_SECONDS: 600
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${ASTRA_LOCAL_S3_BUCKET:?set in .env.local}
      S3_ACCESS_KEY: ${ASTRA_LOCAL_S3_ACCESS_KEY:?set in .env.local}
      S3_SECRET_KEY: ${ASTRA_LOCAL_S3_SECRET_KEY:?set in .env.local}
    ports: ["${ASTRA_LOCAL_MEDIA_VALIDATOR_PORT:?set in .env.local}:4113"]
    depends_on:
      minio-init: { condition: service_completed_successfully }
    networks: [astra-local-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4113/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  public-api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "apps/api/src/public.ts"]
    environment:
      PUBLIC_API_PORT: 4100
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
      ASTRA_REQUEST_ENCRYPTION_KEY: ${ASTRA_LOCAL_REQUEST_ENCRYPTION_KEY:?set in .env.local}
      ASTRA_AUDIT_SIGNING_KEY: ${ASTRA_LOCAL_AUDIT_SIGNING_KEY:?set in .env.local}
      REDIS_URL: redis://redis-node-1:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:${ASTRA_LOCAL_S3_PORT:?set in .env.local}
      S3_BUCKET: ${ASTRA_LOCAL_S3_BUCKET:?set in .env.local}
      S3_ACCESS_KEY: ${ASTRA_LOCAL_S3_ACCESS_KEY:?set in .env.local}
      S3_SECRET_KEY: ${ASTRA_LOCAL_S3_SECRET_KEY:?set in .env.local}
      MEDIA_VALIDATOR_URL: http://media-validator:4113
      MEDIA_VALIDATOR_TOKEN: ${ASTRA_LOCAL_MEDIA_VALIDATOR_TOKEN:?set in .env.local}
      MEDIA_VALIDATOR_CLIENT_TIMEOUT_SECONDS: 610
    ports: ["${ASTRA_LOCAL_PUBLIC_API_PORT:?set in .env.local}:4100"]
    depends_on:
      database-migrate: { condition: service_completed_successfully }
      identity-bootstrap: { condition: service_completed_successfully }
      redis-cluster-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      media-validator: { condition: service_healthy }
    networks: [astra-local-network]

  file-sweeper:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "apps/api/src/file-sweeper.ts"]
    environment:
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${ASTRA_LOCAL_S3_BUCKET:?set in .env.local}
      S3_ACCESS_KEY: ${ASTRA_LOCAL_S3_ACCESS_KEY:?set in .env.local}
      S3_SECRET_KEY: ${ASTRA_LOCAL_S3_SECRET_KEY:?set in .env.local}
      FILE_SWEEPER_INTERVAL_SECONDS: 60
      FILE_SWEEPER_BATCH_SIZE: 100
      FILE_VALIDATION_RECLAIM_SECONDS: 900
      FILE_SWEEPER_METRICS_PORT: 4114
    ports: ["${ASTRA_LOCAL_FILE_SWEEPER_METRICS_PORT:?set in .env.local}:4114"]
    depends_on:
      database-migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    networks: [astra-local-network]

  event-relay:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "apps/event-relay/src/main.ts"]
    environment:
      ASTRA_ENV: local
      EVENT_RELAY_METRICS_PORT: 4112
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
      REDIS_URL: redis://redis-node-1:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: astra-local-event-relay
      EVENT_RELAY_BATCH_SIZE: 100
      EVENT_RELAY_LEASE_SECONDS: 30
      EVENT_RELAY_MAXIMUM_ATTEMPTS: 12
      EVENT_RELAY_POLL_INTERVAL_MS: 500
      REDIS_REBUILD_BATCH_SIZE: 500
      REDIS_REBUILD_LEASE_SECONDS: 900
      REDIS_REBUILD_CHECK_INTERVAL_SECONDS: 30
    ports: ["${ASTRA_LOCAL_EVENT_RELAY_METRICS_PORT:-54112}:4112"]
    depends_on:
      database-migrate: { condition: service_completed_successfully }
      redis-cluster-init: { condition: service_completed_successfully }
      kafka-topic-init: { condition: service_completed_successfully }
    networks: [astra-local-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4112/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  event-contract-tests:
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "scripts/run-integration.ts", "events"]
    environment:
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
      REDIS_URL: redis://redis-node-1:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TASK_TOPIC: astra.task-lifecycle.v1
    depends_on:
      database-migrate: { condition: service_completed_successfully }
      redis-cluster-init: { condition: service_completed_successfully }
      kafka-topic-init: { condition: service_completed_successfully }
    networks: [astra-local-network]
    restart: "no"

  admin-api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "apps/api/src/admin.ts"]
    environment:
      ASTRA_ENV: local
      ADMIN_API_PORT: 4101
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
      ASTRA_REQUEST_ENCRYPTION_KEY: ${ASTRA_LOCAL_REQUEST_ENCRYPTION_KEY:?set in .env.local}
      ASTRA_AUDIT_SIGNING_KEY: ${ASTRA_LOCAL_AUDIT_SIGNING_KEY:?set in .env.local}
      OIDC_ISSUER: http://identity-reference:4180
      OIDC_AUDIENCE: astra-admin
      OIDC_JWKS_URL: http://identity-reference:4180/jwks
      OIDC_CLOCK_SKEW_SECONDS: 60
      ADMIN_SESSION_TTL_SECONDS: 28800
      OCI_REGISTRY_ALLOW_PLAIN_HTTP: "true"
    ports: ["${ASTRA_LOCAL_ADMIN_API_PORT:?set in .env.local}:4101"]
    depends_on:
      database-migrate: { condition: service_completed_successfully }
      identity-reference: { condition: service_healthy }
      registry-reference: { condition: service_healthy }
    networks: [astra-local-network]

  worker-control-api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    command: ["bun", "run", "apps/api/src/worker-control.ts"]
    environment:
      WORKER_CONTROL_API_PORT: 4102
      DATABASE_URL: postgres://${ASTRA_LOCAL_POSTGRES_USER:?set in .env.local}:${ASTRA_LOCAL_POSTGRES_PASSWORD:?set in .env.local}@postgres:5432/${ASTRA_LOCAL_POSTGRES_DB:?set in .env.local}
    ports: ["${ASTRA_LOCAL_WORKER_CONTROL_API_PORT:?set in .env.local}:4102"]
    depends_on: { database-migrate: { condition: service_completed_successfully } }
    networks: [astra-local-network]

networks:
  astra-local-network:
    name: astra-local-network
    driver: bridge

volumes:
  astra-local-postgres:
    name: astra-local-postgres
  astra-local-redis-1:
    name: astra-local-redis-1
  astra-local-redis-2:
    name: astra-local-redis-2
  astra-local-redis-3:
    name: astra-local-redis-3
  astra-local-redis-4:
    name: astra-local-redis-4
  astra-local-redis-5:
    name: astra-local-redis-5
  astra-local-redis-6:
    name: astra-local-redis-6
  astra-local-redpanda:
    name: astra-local-redpanda
  astra-local-minio:
    name: astra-local-minio
