image:
  repository: registry.internal/astra/control-plane
  pullPolicy: IfNotPresent
  tag: "immutable-digest-required"

imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  perDeployment: true

migrations:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCpuUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

externalSecret:
  enabled: false
  name: astra-runtime-secrets
  refreshInterval: 1h
  secretStoreRef:
    name: astra-secrets
    kind: ClusterSecretStore
  remoteKey: astra/production/runtime

apiDeployments:
  - name: public-api
    command: ["bun", "run", "apps/api/src/public.ts"]
    port: 4100
    servicePort: 80
  - name: admin-api
    command: ["bun", "run", "apps/api/src/admin.ts"]
    port: 4101
    servicePort: 80
  - name: worker-control-api
    command: ["bun", "run", "apps/api/src/worker-control.ts"]
    port: 4102
    servicePort: 80

controlPlaneDeployments:
  - name: scheduler
    command: ["bun", "run", "apps/scheduler/src/main.ts"]
    port: 4110
  - name: provider-controller
    command: ["bun", "run", "apps/provider-controller/src/main.ts"]
    port: 4111
  - name: event-relay
    command: ["bun", "run", "apps/event-relay/src/main.ts"]
    port: 4112

env:
  ASTRA_ENV: production
  ASTRA_LOG_LEVEL: info
secretRef: astra-runtime-secrets
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 1, memory: 1Gi }
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
networkPolicy:
  enabled: true
  namespaceSelector: {}
  allowedIngressNamespaceSelector:
    matchLabels:
      astra.network/allow: ingress
  allowedIngressNamespaceSelectors: {}
  allowedMetricsNamespaceSelector:
    matchLabels:
      astra.network/allow: metrics
  allowedEgress:
    - name: database
      namespaceSelector: {}
      podSelector:
        matchLabels: { app.kubernetes.io/name: postgresql }
      ports: [{ protocol: TCP, port: 5432 }]
    - name: redis
      namespaceSelector: {}
      podSelector:
        matchLabels: { app.kubernetes.io/name: redis }
      ports: [{ protocol: TCP, port: 6379 }]
    - name: kafka
      namespaceSelector: {}
      podSelector:
        matchLabels: { app.kubernetes.io/name: kafka }
      ports: [{ protocol: TCP, port: 9092 }]
    - name: https
      namespaceSelector: {}
      podSelector: {}
      ports: [{ protocol: TCP, port: 443 }]
