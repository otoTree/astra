{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "astra.fullname" . }}-migrate
  labels:
    app.kubernetes.io/name: {{ include "astra.name" . }}
    astra.component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "astra.name" . }}
        astra.component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "astra.serviceAccountName" . }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: migration
          image: {{ include "astra.imageReference" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "packages/database/src/migrate.ts"]
          envFrom:
            - secretRef: { name: {{ .Values.secretRef }} }
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- end }}
