{{- range .Values.controlPlaneDeployments }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astra.fullname" $ }}-{{ .name }}
  labels:
    app.kubernetes.io/name: {{ include "astra.name" $ }}
    astra.trust-domain: {{ .name | quote }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra.name" $ }}
      astra.deployment: {{ .name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "astra.name" $ }}
        astra.deployment: {{ .name | quote }}
    spec:
      serviceAccountName: {{ if $.Values.serviceAccount.perDeployment }}{{ include "astra.fullname" $ }}-{{ .name }}{{ else }}{{ include "astra.serviceAccountName" $ }}{{ end }}
      securityContext:
{{ toYaml $.Values.podSecurityContext | indent 8 }}
      containers:
        - name: {{ .name }}
          image: {{ include "astra.imageReference" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ toJson .command }}
          ports:
            - name: metrics
              containerPort: {{ .port }}
          envFrom:
            - secretRef: { name: {{ $.Values.secretRef }} }
          securityContext:
{{ toYaml $.Values.containerSecurityContext | indent 12 }}
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          readinessProbe:
            httpGet: { path: /health/ready, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 20
---
{{- end }}
