{{- range .Values.apiDeployments }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astra.fullname" $ }}-{{ .name }}
  labels:
    app.kubernetes.io/name: {{ include "astra.name" $ }}
    astra.trust-domain: {{ .name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra.name" $ }}
      astra.deployment: {{ .name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "astra.name" $ }}
        astra.deployment: {{ .name | quote }}
    spec:
      serviceAccountName: {{ include "astra.serviceAccountName" $ }}
      securityContext:
{{ toYaml $.Values.podSecurityContext | indent 8 }}
      containers:
        - name: {{ .name }}
          image: {{ $.Values.image.repository }}@{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ toJson .command }}
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: ASTRA_ENV
              value: {{ $.Values.env.ASTRA_ENV | quote }}
            - name: ASTRA_LOG_LEVEL
              value: {{ $.Values.env.ASTRA_LOG_LEVEL | quote }}
          envFrom:
            - secretRef:
                name: {{ $.Values.secretRef }}
          securityContext:
{{ toYaml $.Values.containerSecurityContext | indent 12 }}
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
---
{{- end }}
