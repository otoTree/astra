{{- if .Values.monitoring.enabled }}
{{- range .Values.apiDeployments }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "astra.fullname" $ }}-{{ .name }}
  labels:
{{ toYaml $.Values.monitoring.serviceMonitor.labels | indent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra.name" $ }}
      astra.deployment: {{ .name | quote }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ $.Values.monitoring.serviceMonitor.scrapeTimeout | quote }}
---
{{- end }}
{{- range .Values.controlPlaneDeployments }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "astra.fullname" $ }}-{{ .name }}
  labels:
{{ toYaml $.Values.monitoring.serviceMonitor.labels | indent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra.name" $ }}
      astra.deployment: {{ .name | quote }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ $.Values.monitoring.serviceMonitor.scrapeTimeout | quote }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "astra.fullname" . }}
  labels:
{{ toYaml .Values.monitoring.prometheusRule.labels | indent 4 }}
  annotations:
{{ toYaml .Values.monitoring.prometheusRule.annotations | indent 4 }}
spec:
  groups:
    - name: astra.control-plane
      interval: {{ .Values.monitoring.prometheusRule.evaluationInterval | quote }}
      rules:
        - alert: AstraControlPlaneUnavailable
          expr: up{service=~"{{ include "astra.fullname" . }}-(public-api|admin-api|worker-control-api|scheduler|provider-controller|event-relay)"} == 0
          for: 5m
          labels:
            severity: critical
            component: control-plane
          annotations:
            summary: Astra control-plane target is unavailable
            description: One or more Astra control-plane targets have been down for more than five minutes.
            runbook_url: "{{ .Values.monitoring.prometheusRule.annotations.runbook_base_url | default "" }}/disaster-recovery"
        - alert: AstraSchedulerFailures
          expr: increase(astra_scheduler_iterations_total{outcome="failure"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
            component: scheduler
          annotations:
            summary: Astra scheduler has failed iterations
            description: Scheduler iterations have failed during the last five minutes; inspect database and lease health.
        - alert: AstraEventRelayBacklog
          expr: max by (sink) (astra_event_relay_oldest_age_seconds{status!="delivered"}) > 300
          for: 10m
          labels:
            severity: warning
            component: event-relay
          annotations:
            summary: Astra event relay backlog is stale
            description: The oldest undelivered event has exceeded five minutes.
        - alert: AstraProviderSnapshotStale
          expr: astra_provider_snapshot_usable == 0
          for: 5m
          labels:
            severity: critical
            component: provider-controller
          annotations:
            summary: Astra provider inventory is unusable
            description: Capacity placement and provider writes should be suppressed until a fresh snapshot is published.
        - alert: AstraCapacityAdmissionControl
          expr: increase(astra_capacity_plans_total{outcome="admission_control"}[10m]) > 0
          for: 10m
          labels:
            severity: warning
            component: scheduler
          annotations:
            summary: Astra capacity admission control is active
            description: Tasks are being held because capacity, inventory, budget or queue ETA limits were reached.
{{- end }}
