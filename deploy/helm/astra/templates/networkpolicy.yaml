{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- range .Values.apiDeployments }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" $ }}-{{ .name }}-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra.name" $ }}
      astra.deployment: {{ .name | quote }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
{{- $selector := $.Values.networkPolicy.allowedIngressNamespaceSelector }}
{{- if $.Values.networkPolicy.allowedIngressNamespaceSelectors }}
{{- $configured := index $.Values.networkPolicy.allowedIngressNamespaceSelectors .name }}
{{- if $configured }}
{{- $selector = $configured }}
{{- end }}
{{- end }}
{{ toYaml $selector | indent 12 }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{- end }}
{{- range .Values.controlPlaneDeployments }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" $ }}-{{ .name }}-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra.name" $ }}
      astra.deployment: {{ .name | quote }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
{{ toYaml $.Values.networkPolicy.allowedMetricsNamespaceSelector | indent 12 }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" . }}-dependency-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra.name" . }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- range .Values.networkPolicy.allowedEgress }}
    - to:
        - namespaceSelector:
{{ toYaml .namespaceSelector | indent 12 }}
{{- if .podSelector }}
          podSelector:
{{ toYaml .podSelector | indent 12 }}
{{- end }}
      ports:
{{ toYaml .ports | indent 8 }}
{{- end }}
{{- end }}
