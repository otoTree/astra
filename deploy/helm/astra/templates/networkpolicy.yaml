{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" . }}-internal-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: {{ include "astra.name" . }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
{{ toYaml .Values.networkPolicy.allowedIngressNamespaceSelector | indent 12 }}
      ports:
        - protocol: TCP
          port: 4100
        - protocol: TCP
          port: 4101
        - protocol: TCP
          port: 4102
        - protocol: TCP
          port: 4110
        - protocol: TCP
          port: 4111
        - protocol: TCP
          port: 4112
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" . }}-dependency-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: {{ include "astra.name" . }} }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- range .Values.networkPolicy.allowedEgress }}
    - to:
        - namespaceSelector:
{{ toYaml .namespaceSelector | indent 12 }}
{{- if .podSelector }}
          podSelector:
{{ toYaml .podSelector | indent 12 }}
{{- end }}
      ports:
{{ toYaml .ports | indent 8 }}
{{- end }}
{{- end }}
